schema_version: 1

defaults:
  architecture:
    binary1: "x86:LE:64:default"
    binary2: "x86:LE:64:default"
  phase0:
    status: "UNKNOWN"
    has_counterexample: false
  assumptions:
    structural_match: false
    smt_confirmed_after_structural: null

# Canonical statuses and verdicts:
# - phase0.status: SAT | UNSAT | UNKNOWN | TIMEOUT
# - expected.final_verdict: EQUIVALENT | NOT_EQUIVALENT | UNKNOWN
# - expected.allowed_recovery_phases: list of phase names that may run after phase0
# - expected.required_stage_path: ordered stage checkpoints expected to run
# - expected.phase4b_gate_allowed: true|false (P4B gate condition check)
#
# Stage names (outer-level):
#   S_PAIRWISE, S_MONOLITHIC_FALLBACK
#
# Phase names (pipeline-level):
#   P0_BASE, P1_SIGNEDNESS, P2_PATTERN_INT, P4B_MIPS64_SPURIOUS

test_cases:
  - id: "pairwise_equiv_all_unsat"
    description: "All checked pairs are UNSAT; equivalence is proven."
    scope: "pairwise"
    phase0:
      status: "UNSAT"
      has_counterexample: false
    assumptions:
      pairwise_stats:
        total_pairs: 4
        unsat_pairs: 4
        sat_pairs: 0
        unknown_pairs: 0
    expected:
      final_verdict: "EQUIVALENT"
      stop_after_phase0: true
      allowed_recovery_phases: []
      required_stage_path:
        - "S_PAIRWISE"

  - id: "pairwise_not_equiv_first_sat"
    description: "First SAT pair yields a real counterexample; stop as NOT_EQUIVALENT."
    scope: "pairwise"
    phase0:
      status: "SAT"
      has_counterexample: true
    assumptions:
      pairwise_stats:
        total_pairs: 4
        unsat_pairs: 0
        sat_pairs: 1
        unknown_pairs: 0
    expected:
      final_verdict: "NOT_EQUIVALENT"
      stop_after_phase0: true
      allowed_recovery_phases: []
      required_stage_path:
        - "S_PAIRWISE"

  - id: "pairwise_unknown_no_sat"
    description: "No SAT pair exists but at least one pair is UNKNOWN/TIMEOUT."
    scope: "pairwise"
    phase0:
      status: "UNKNOWN"
      has_counterexample: false
    assumptions:
      pairwise_stats:
        total_pairs: 3
        unsat_pairs: 2
        sat_pairs: 0
        unknown_pairs: 1
    expected:
      final_verdict: "UNKNOWN"
      stop_after_phase0: false
      allowed_recovery_phases:
        - "P1_SIGNEDNESS"
        - "P2_PATTERN_INT"
      required_stage_path:
        - "S_PAIRWISE"
        - "S_MONOLITHIC_FALLBACK"

  - id: "structural_match_requires_smt_confirmation"
    description: "Structural match is only a hint; SMT confirmation remains mandatory."
    scope: "pairwise"
    phase0:
      status: "UNSAT"
      has_counterexample: false
    assumptions:
      structural_match: true
      smt_confirmed_after_structural: true
    expected:
      final_verdict: "EQUIVALENT"
      stop_after_phase0: true
      allowed_recovery_phases: []
      required_stage_path:
        - "S_PAIRWISE"

  - id: "sat_does_not_enter_type_fix_by_default"
    description: "SAT should not enter generic type-fix recovery phases."
    scope: "phase_gate"
    phase0:
      status: "SAT"
      has_counterexample: true
    expected:
      final_verdict: "NOT_EQUIVALENT"
      stop_after_phase0: true
      allowed_recovery_phases: []
      allowed_special_phases: []
      required_stage_path:
        - "S_PAIRWISE"

  - id: "sat_mips64_spurious_allows_phase4b_only"
    description: "SAT with MIPS64 spurious pattern may enter only P4B retry path."
    scope: "phase_gate"
    architecture:
      binary1: "MIPS:BE:64:64-32addr"
      binary2: "x86:LE:64:default"
    phase0:
      status: "SAT"
      has_counterexample: true
      counterexample:
        param_1_1: 18446744069414584321  # 0xFFFFFFFF00000001
        param_1_2: 1
    expected:
      final_verdict: "NOT_EQUIVALENT"
      stop_after_phase0: false
      allowed_recovery_phases:
        - "P4B_MIPS64_SPURIOUS"
      allowed_special_phases:
        - "P4B_MIPS64_SPURIOUS"
      phase4b_gate_allowed: true
      required_stage_path:
        - "S_PAIRWISE"

  - id: "unknown_allows_signedness_recovery"
    description: "UNKNOWN may enter signedness recovery first."
    scope: "phase_gate"
    phase0:
      status: "UNKNOWN"
      has_counterexample: false
    expected:
      final_verdict: "UNKNOWN"
      stop_after_phase0: false
      allowed_recovery_phases:
        - "P1_SIGNEDNESS"
        - "P2_PATTERN_INT"
      required_stage_path:
        - "S_PAIRWISE"
        - "S_MONOLITHIC_FALLBACK"

  - id: "timeout_allows_signedness_recovery"
    description: "TIMEOUT follows the same recovery gate as UNKNOWN."
    scope: "phase_gate"
    phase0:
      status: "TIMEOUT"
      has_counterexample: false
    expected:
      final_verdict: "UNKNOWN"
      stop_after_phase0: false
      allowed_recovery_phases:
        - "P1_SIGNEDNESS"
        - "P2_PATTERN_INT"
      required_stage_path:
        - "S_PAIRWISE"
        - "S_MONOLITHIC_FALLBACK"

  - id: "phase_sequence_unknown_to_signedness_equiv"
    description: "Pipeline recovers from UNKNOWN at phase0, then reaches EQUIVALENT in P1."
    scope: "phase_sequence"
    phase0:
      status: "UNKNOWN"
      has_counterexample: false
    expected:
      final_verdict: "EQUIVALENT"
      stop_after_phase0: false
      allowed_recovery_phases:
        - "P1_SIGNEDNESS"
      expected_phase_sequence:
        - "P0_BASE"
        - "P1_SIGNEDNESS"
      required_stage_path:
        - "S_PAIRWISE"
        - "S_MONOLITHIC_FALLBACK"

  - id: "phase_sequence_unknown_to_pattern_int_equiv"
    description: "P1 does not resolve; P2 pattern-int repair resolves to EQUIVALENT."
    scope: "phase_sequence"
    phase0:
      status: "UNKNOWN"
      has_counterexample: false
    expected:
      final_verdict: "EQUIVALENT"
      stop_after_phase0: false
      allowed_recovery_phases:
        - "P1_SIGNEDNESS"
        - "P2_PATTERN_INT"
      expected_phase_sequence:
        - "P0_BASE"
        - "P1_SIGNEDNESS"
        - "P2_PATTERN_INT"
      required_stage_path:
        - "S_PAIRWISE"
        - "S_MONOLITHIC_FALLBACK"