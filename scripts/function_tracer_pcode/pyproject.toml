[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "function_tracer_pcode"
version = "0.1.0"
description = "Ghidra-based function equivalence checker"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "cryptography>=3.4.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools]
package-dir = {"" = ".."}

[tool.setuptools.packages.find]
where = [".."]
include = ["function_tracer_pcode*"]

[tool.pytest.ini_options]
# Canonical import path is `scripts.function_tracer_pcode` (all intra-package
# imports are absolute); the repository root must be on sys.path.
pythonpath = ["../.."]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = [
    "recorded_replay: runs a recorded P-code replay (Issue #109); deselected by the per-PR unit-fast job",
    "unscoped_condition_cache: runs outside any condition-cache scope (Issue #224); only for tests of the scope itself",
    "wall_clock: asserts a wall-clock bound through a clock read outside the test module (Issue #239); its call runs with the older heap frozen",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
