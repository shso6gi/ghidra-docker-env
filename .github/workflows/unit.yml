name: unit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The per-PR gate is two independent jobs so they start together: the ordinary
# suite and the light recorded replays. The two heavy replays (wood,
# barthe2big) dominate the corpus wall clock and run in the recorded-full
# workflow, which covers all nine with the same validator -- keeping them off
# the critical path is a scheduling decision, not a coverage one.
jobs:
  unit-fast:
    name: unit-fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      # Layer packages re-export lazily (PEP 562); importing each one must not
      # need Ghidra/Java and must not create an import cycle.
      - name: Package import check
        run: |
          python3 -B - <<'PY'
          import importlib
          layers = (
              "core", "smt", "config", "ghidra", "analysis", "semantics",
              "proof", "authority", "checker", "reporting", "cli",
          )
          importlib.import_module("scripts.function_tracer_pcode")
          for layer in layers:
              importlib.import_module(f"scripts.function_tracer_pcode.{layer}")
          print("imported:", ", ".join(layers))
          PY

      - name: compileall
        run: python3 -B -m compileall -q scripts

      # -m "not recorded_replay" DESELECTS the recorded replays; it does not
      # skip them. Everything else runs, including the cheap recorded-corpus
      # contract tests (manifest, ground-truth drift, verification metadata,
      # clean provenance, deadline behaviour) in
      # tests/unit/test_recorded_corpus_contracts.py.
      # -rs proves no test turned into a skip to get here.
      - name: Unit suite (recorded replays deselected)
        run: >
          python3 -B -m pytest scripts/function_tracer_pcode/tests/unit
          -q -rs --durations=25 -p no:cacheprovider
          -m "not recorded_replay"

  recorded-fast:
    name: recorded-fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      # The recorded corpus drives the real solver through the production path
      # and is written to fail rather than skip when z3 is missing, so the CLI
      # has to be on PATH. `z3-solver` ships `bin/z3` next to the interpreter;
      # add that directory when the CLI is not already reachable, and prove the
      # result in a fresh shell below.
      - name: Put the z3 CLI on PATH
        run: |
          if ! command -v z3 >/dev/null 2>&1; then
            echo "$(python3 -c 'import sys; print(sys.prefix)')/bin" >> "$GITHUB_PATH"
          fi

      - name: z3 CLI is reachable
        run: |
          command -v z3
          z3 --version

      # Default tier is pr_gate: the replays cases.json marks pr_gate=true.
      # Which ones those are is a manifest decision, not a -k string here.
      # The same validator runs in recorded-full; nothing is weakened for the
      # gate. The test prints each replay's wall clock before it reports.
      - name: Recorded replays (PR gate)
        run: >
          python3 -B -m pytest
          scripts/function_tracer_pcode/tests/unit/test_recorded_pairs.py
          -q -rs --durations=25 -p no:cacheprovider

      # The gate must run exactly the manifest's pr_gate set: neither a silent
      # drop (a replay stops running) nor a silent widening.
      - name: The gate ran exactly the manifest's pr_gate replays
        run: |
          python3 -B - <<'PY'
          from scripts.function_tracer_pcode.tests.fixtures.pcode.corpus import (
              ALL_REPLAYS, PR_GATE_REPLAYS,
          )
          gate = [spec.variant_id for spec in PR_GATE_REPLAYS]
          print("pr_gate replays ({}):".format(len(gate)))
          for name in gate:
              print("  " + name)
          outside = [s.variant_id for s in ALL_REPLAYS if not s.pr_gate]
          print("run by recorded-full only ({}): {}".format(
              len(outside), ", ".join(outside)))
          assert len(gate) == 7, gate
          assert len(ALL_REPLAYS) == 9, ALL_REPLAYS
          PY
